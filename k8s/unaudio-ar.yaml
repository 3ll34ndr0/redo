# unaudio.ar (and www): TEMPORARY redirect to the same path on unaudio.marso.ar, until the domain
# gets its own service. Not permanent on purpose: browsers mustn't remember it. Like the old
# name, Traefik answers the redirect itself (records in ~/Documentos/laburo/leandro dns/dnsconfig.js).
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: unaudio-ar-to-unaudio
  namespace: extractos
spec:
  redirectRegex:
    regex: ^https?://(www\.)?unaudio\.ar/(.*)
    replacement: https://unaudio.marso.ar/${2}
    permanent: false
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: unaudio-ar
  namespace: extractos
  annotations:
    traefik.ingress.kubernetes.io/router.entrypoints: web
    traefik.ingress.kubernetes.io/router.middlewares: extractos-unaudio-ar-to-unaudio@kubernetescrd
spec:
  ingressClassName: traefik
  rules:
    - host: unaudio.ar
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:                # never reached: the middleware redirects first
                name: extractos
                port:
                  number: 5000
    - host: www.unaudio.ar
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: extractos
                port:
                  number: 5000
