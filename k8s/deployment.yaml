apiVersion: apps/v1
kind: Deployment
metadata:
  name: extractos
  namespace: extractos
spec:
  # ONE replica, ONE gunicorn worker: rate limits and the search index live in memory.
  replicas: 1
  selector:
    matchLabels:
      app: extractos
  template:
    metadata:
      labels:
        app: extractos
      annotations:
        # metrics on port 9100 (/metrics), for a Prometheus or Grafana Alloy scraping the cluster
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        k8s.grafana.com/scrape: "true"
        k8s.grafana.com/metrics.portNumber: "9100"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: extractos
          # The tag is rewritten by .github/workflows/deploy.yml on every build
          image: ghcr.io/3ll34ndr0/redo:b43f0276a0d1eca90fe6cae863da6725e5540f00
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
            - name: metrics
              containerPort: 9100
          env:
            - name: OTEL_SERVICE_NAME
              value: extractos
            # Traces → Grafana Alloy's OTLP receiver (k3s-cluster repo, monitoring/) → Grafana Cloud
            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://grafana-cloud-otel-receiver.monitoring.svc:4318
            - name: SNIPPET_CACHE_MB      # app deletes the oldest clips above this
              value: "300"
            - name: REPORTS_DB            # clip reports (¿No coincide?), on reports-pvc.yaml
              value: /reports/reports.db
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Songs (music/) + search database (redondos.db), copied to the VPS with rsync.
            # The whole folder is mounted (not the .db file alone) so a new database
            # copied over is seen by the app, which reloads it when it changes.
            - name: data
              mountPath: /data
              readOnly: true
            - name: cache
              mountPath: /cache
            - name: reports
              mountPath: /reports
            - name: tmp
              mountPath: /tmp
          # Starting takes ~10 s with the CPU limit (imports + search index): the startup
          # probe allows up to 60 s; liveness/readiness only begin once it has passed.
          startupProbe:
            httpGet:
              path: /healthz
              port: 5000
            periodSeconds: 2
            timeoutSeconds: 3
            failureThreshold: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            periodSeconds: 10
            timeoutSeconds: 3
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            periodSeconds: 30
            timeoutSeconds: 3
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
      volumes:
        - name: data
          hostPath:
            path: /srv/extractos
            type: Directory
        - name: reports                  # kept across restarts and deploys
          persistentVolumeClaim:
            claimName: extractos-reports
        - name: cache                    # clips cut so far; lost on restart, re-cut on demand
          emptyDir:
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
