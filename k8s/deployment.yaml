apiVersion: apps/v1
kind: Deployment
metadata:
  name: extractos
  namespace: extractos
spec:
  # ONE replica, ONE gunicorn worker: rate limits and the search index live in memory.
  replicas: 1
  selector:
    matchLabels:
      app: extractos
  template:
    metadata:
      labels:
        app: extractos
      annotations:
        # metrics on port 9100 (/metrics), for a Prometheus or Grafana Alloy scraping the cluster
        prometheus.io/scrape: "true"
        prometheus.io/port: "9100"
        k8s.grafana.com/scrape: "true"
        k8s.grafana.com/metrics.portNumber: "9100"
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
      containers:
        - name: extractos
          # The tag is rewritten by .github/workflows/deploy.yml on every build
          image: ghcr.io/3ll34ndr0/redo:0a7fdc225ebd6b47ea9ca098bcb9927c87e1fb8f
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5000
            - name: metrics
              containerPort: 9100
          env:
            - name: OTEL_SERVICE_NAME
              value: extractos
            # Traces are sent only once this is set (the collector, e.g. Grafana Alloy):
            # - name: OTEL_EXPORTER_OTLP_ENDPOINT
            #   value: http://alloy.monitoring:4318
            - name: SNIPPET_CACHE_MB      # app deletes the oldest clips above this
              value: "300"
          securityContext:
            readOnlyRootFilesystem: true
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            # Songs (music/) + search database (redondos.db), copied to the VPS with rsync.
            # The whole folder is mounted (not the .db file alone) so a new database
            # copied over is seen by the app, which reloads it when it changes.
            - name: data
              mountPath: /data
              readOnly: true
            - name: cache
              mountPath: /cache
            - name: tmp
              mountPath: /tmp
          readinessProbe:
            httpGet:
              path: /healthz
              port: 5000
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: 5000
            periodSeconds: 30
            failureThreshold: 3
          resources:
            requests:
              cpu: 50m
              memory: 96Mi
            limits:
              cpu: 500m
              memory: 384Mi
      volumes:
        - name: data
          hostPath:
            path: /srv/extractos
            type: Directory
        - name: cache                    # clips cut so far; lost on restart, re-cut on demand
          emptyDir:
            sizeLimit: 512Mi
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
