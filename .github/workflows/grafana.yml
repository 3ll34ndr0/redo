name: Grafana dashboard (OpenTofu)

# monitoring/tofu manages the Extractos folder + dashboard in Grafana Cloud (leandro.grafana.net).
# PR: plan only. Push to main: apply. State: Contabo Object Storage bucket opentofu-states
# (encrypted, locked).
# Secrets: GRAFANA_SA_TOKEN (service account token, Editor), TOFU_STATE_PASSPHRASE,
#          CONTABO_S3_ACCESS_KEY_ID, CONTABO_S3_SECRET_ACCESS_KEY.
# Repo variables: CONTABO_S3_ENDPOINT (e.g. https://usa1.contabostorage.com);
#          optional GRAFANA_PROM_DS / GRAFANA_LOKI_DS (data source names, if not the defaults).

on:
  push:
    branches: [main]
    paths:
      - "monitoring/**"
      - ".github/workflows/grafana.yml"
  pull_request:
    paths:
      - "monitoring/**"
      - ".github/workflows/grafana.yml"
  workflow_dispatch:

permissions:
  contents: read

# One run at a time (the state is also locked in the bucket, if the storage supports it)
concurrency:
  group: grafana-tofu
  cancel-in-progress: false

env:
  TF_VAR_grafana_token: ${{ secrets.GRAFANA_SA_TOKEN }}
  TF_VAR_state_passphrase: ${{ secrets.TOFU_STATE_PASSPHRASE }}
  AWS_ACCESS_KEY_ID: ${{ secrets.CONTABO_S3_ACCESS_KEY_ID }}
  AWS_SECRET_ACCESS_KEY: ${{ secrets.CONTABO_S3_SECRET_ACCESS_KEY }}
  AWS_ENDPOINT_URL_S3: ${{ vars.CONTABO_S3_ENDPOINT }}
  AWS_DEFAULT_REGION: us-east-1
  TF_VAR_prometheus_data_source: ${{ vars.GRAFANA_PROM_DS || 'grafanacloud-leandro-prom' }}
  TF_VAR_loki_data_source: ${{ vars.GRAFANA_LOKI_DS || 'grafanacloud-leandro-logs' }}
  TF_IN_AUTOMATION: "1"

jobs:
  tofu:
    # PRs from forks get no secrets: nothing to do there
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: monitoring/tofu
    steps:
      - uses: actions/checkout@v5

      - name: Dashboard JSON matches make_dashboard.py
        working-directory: monitoring
        run: |
          python3 make_dashboard.py
          git diff --exit-code extractos-dashboard.json \
            || { echo "::error::extractos-dashboard.json is stale: run python3 monitoring/make_dashboard.py and commit"; exit 1; }

      # OpenTofu's lock (use_lockfile) needs conditional writes: a second "create only if
      # missing" upload of the same object must be refused (412). curl signs the S3 requests
      # (SigV4) and shows the raw HTTP status; the AWS CLI crashed on Contabo's answer.
      - name: Check the bucket (access, and support for state locking)
        run: |
          bucket=opentofu-states
          key="redo/lock-probe-${GITHUB_RUN_ID}"
          url="${AWS_ENDPOINT_URL_S3%/}/$bucket/$key"
          s3() { curl -s -o /dev/null -w '%{http_code}' --aws-sigv4 "aws:amz:${AWS_DEFAULT_REGION}:s3" \
                   --user "$AWS_ACCESS_KEY_ID:$AWS_SECRET_ACCESS_KEY" "$@" "$url"; }
          echo "::notice::endpoint: ${AWS_ENDPOINT_URL_S3:-<CONTABO_S3_ENDPOINT variable not set>}"
          code=$(s3 -X PUT --data probe)
          if [ "$code" != 200 ]; then
            echo "::error::cannot write to bucket $bucket: HTTP $code (credentials, endpoint or bucket name)"
            exit 1
          fi
          code=$(s3 -X PUT -H 'If-None-Match: *' --data probe)
          case "$code" in
            412) echo "::notice::state locking supported (conditional write refused: HTTP 412)" ;;
            200) echo "::warning::the bucket ignores conditional writes: OpenTofu's state lock does not work (CI runs still never overlap)" ;;
            *)   echo "::warning::conditional writes not supported (HTTP $code): OpenTofu's state lock may fail" ;;
          esac
          s3 -X DELETE >/dev/null

      - uses: opentofu/setup-opentofu@v2
        with:
          tofu_version: 1.13.1
          tofu_wrapper: false

      - run: tofu init -input=false
      - run: tofu validate
      - run: tofu plan -input=false -out=dashboard.tfplan

      - name: Apply
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        run: tofu apply -input=false dashboard.tfplan

