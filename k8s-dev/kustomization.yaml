# Staging: the development branch at https://unaudio-dev.marso.ar (namespace unaudio-dev,
# Argo CD app "unaudio-dev", argocd-application-dev.yaml). Production's manifests (../k8s) with:
# its own namespace and reports volume, its own image (tag below, rewritten by
# .github/workflows/deploy.yml on every push to development), no old-name redirect, and
# a noindex header. Songs and database: production's /srv/extractos, read-only.
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
namespace: unaudio-dev
resources:
  - ../k8s
  - noindex.yaml
images:
  - name: ghcr.io/3ll34ndr0/redo
    newTag: edd13321ee8129e1a1e8531869f7e5cc3239998b
patches:
  - path: ingress.yaml
  - target: {kind: Ingress, name: extractos-old-name}
    patch: |
      $patch: delete
      apiVersion: networking.k8s.io/v1
      kind: Ingress
      metadata: {name: extractos-old-name}
  - target: {kind: Middleware, name: to-unaudio}
    patch: |
      $patch: delete
      apiVersion: traefik.io/v1alpha1
      kind: Middleware
      metadata: {name: to-unaudio}
  - patch: |                    # its traces apart from production's
      apiVersion: apps/v1
      kind: Deployment
      metadata: {name: extractos, namespace: extractos}
      spec:
        template:
          spec:
            containers:
              - name: extractos
                env:
                  - name: OTEL_SERVICE_NAME
                    value: unaudio-dev
                  - name: AUTO_APPLY_REPORTS      # provisional fixes: tried here first
                    value: "1"
